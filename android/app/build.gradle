
plugins { 
    id "com.android.application" 
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin" 
    id "com.google.protobuf" version "0.9.4" 
    id "com.squareup.wire" version "5.3.1"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No keystore defined. The app will not be signed."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')?: '1'

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace 'com.raynlabs.app'
    testNamespace "test.com.raynlabs.app"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.raynlabs.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    splits {
        abi {
            enable true
            reset()
            //noinspection ChromeOsAbiSupport
            include "x86_64", "armeabi-v7a", "arm64-v8a"

            universalApk true
        }
    }

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            } else {
                // Never fall back to the debug key for a release artifact.
                // Leave it unsigned; the task-graph guard below fails the
                // build before an unsigned/debug-signed release can ship.
                signingConfig null
            }
            // Minification is intentionally OFF: the app's logic is in Dart
            // (libapp.so) and the Go core (libhiddify-core.so), neither touched
            // by R8 — only the thin Kotlin shell would be, where the breakage
            // risk (gomobile JNI callbacks, gRPC, gson) outweighs the benefit.
            // proguard-rules.pro is kept current as a safety net so enabling
            // minifyEnabled later won't strip the native bridge. If enabled,
            // re-validate on-device (see CORE_BUILD.md).
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "x86_64", "armeabi-v7a", "arm64-v8a"
                debugSymbolLevel 'FULL'
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = android.defaultConfig.versionCode
    }
}

// Refuse to assemble/bundle a release artifact without the upload keystore,
// rather than silently signing it with the debug key. Only trips for release
// packaging tasks, so `flutter run` / debug builds work without key.properties.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        def n = task.name.toLowerCase()
        n.contains("release") && (n.startsWith("assemble") || n.startsWith("bundle") || n.startsWith("package"))
    }
    if (buildingRelease && !hasKeyStore) {
        throw new GradleException(
            "Release build requires android/key.properties pointing to the upload " +
            "keystore (alias 'upload'). Refusing to sign a release with the debug key. " +
            "See CORE_BUILD.md → 'Release signing (Play App Signing)'."
        )
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation("com.squareup.wire:wire-grpc-client:5.3.1")

    implementation 'io.grpc:grpc-okhttp:1.64.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'

    // Google Play Billing Library. Present so the build declares the
    // `com.android.vending.BILLING` permission (merged in from this AAR's own
    // manifest) — that permission is what Play Console detects before it lets
    // you create/activate subscription products. The actual purchase flow
    // (queryProductDetails / launchBillingFlow / verify) is Phase 2 of
    // IAP_Integration/IAP-INTEGRATION-ROADMAP.md and not wired yet.
    // NOTE: if a future Phase 2 adopts the Flutter `in_app_purchase` plugin,
    // drop this line — that plugin bundles its own Billing dependency and the
    // two would conflict. Keep it only while integrating Billing natively.
    implementation 'com.android.billingclient:billing:8.2.0'
//    protoPath(project(':hiddify_api'))
//    implementation project(':hiddify_api')




}
