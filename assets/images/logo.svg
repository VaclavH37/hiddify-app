<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faceted gem inside ensō circle">
  <!-- Ensō outer ring: incomplete brush-stroke circle with gap at the top -->
  <path d="M 315.53 33.84 A 230 230 0 1 1 196.47 33.84"
        fill="none" stroke="#f59e0b" stroke-width="40" stroke-linecap="round"/>

  <!-- Inner gem wireframe: hexagonal antiprism (outer flat-top hex + inner pointy-top hex + triangulated sides) -->
  <g stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer hexagon (flat-top, R=130) -->
    <line x1="321" y1="143.4" x2="386" y2="256"/>
    <line x1="386" y1="256" x2="321" y2="368.6"/>
    <line x1="321" y1="368.6" x2="191" y2="368.6"/>
    <line x1="191" y1="368.6" x2="126" y2="256"/>
    <line x1="126" y1="256" x2="191" y2="143.4"/>
    <line x1="191" y1="143.4" x2="321" y2="143.4"/>

    <!-- Inner hexagon (pointy-top, rotated 30°, R=70) -->
    <line x1="256" y1="186" x2="316.62" y2="221"/>
    <line x1="316.62" y1="221" x2="316.62" y2="291"/>
    <line x1="316.62" y1="291" x2="256" y2="326"/>
    <line x1="256" y1="326" x2="195.38" y2="291"/>
    <line x1="195.38" y1="291" x2="195.38" y2="221"/>
    <line x1="195.38" y1="221" x2="256" y2="186"/>

    <!-- 12 connecting edges between outer and inner hex (the triangulated faces) -->
    <line x1="321" y1="143.4" x2="256" y2="186"/>
    <line x1="321" y1="143.4" x2="316.62" y2="221"/>
    <line x1="386" y1="256" x2="316.62" y2="221"/>
    <line x1="386" y1="256" x2="316.62" y2="291"/>
    <line x1="321" y1="368.6" x2="316.62" y2="291"/>
    <line x1="321" y1="368.6" x2="256" y2="326"/>
    <line x1="191" y1="368.6" x2="256" y2="326"/>
    <line x1="191" y1="368.6" x2="195.38" y2="291"/>
    <line x1="126" y1="256" x2="195.38" y2="291"/>
    <line x1="126" y1="256" x2="195.38" y2="221"/>
    <line x1="191" y1="143.4" x2="195.38" y2="221"/>
    <line x1="191" y1="143.4" x2="256" y2="186"/>
  </g>
</svg>
